<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>bighelp</title>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { overflow: hidden; background: #FFF9F5; }
    @media (prefers-color-scheme: dark) { body { background: #121110; } }
    #root { display: flex; position: relative; }
    :focus-visible { outline: 2px solid #7B52E0; outline-offset: 2px; }
    dialog::backdrop { background: rgba(20, 16, 14, .42); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    pre::selection, td::selection, th::selection { background: rgba(123, 82, 224, .28); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="renderer.js"></script>
</body>
</html>
